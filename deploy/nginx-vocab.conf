# Wordwell 自托管 反向代理（放在 OpenWrt /etc/nginx/conf.d/vocab.conf）
# 上游是 192.168.20.2 上 Docker 发布的 8080 端口（compose 的 APP_BIND/APP_PORT）。
# 泛域名证书路径与 router.961125.xyz 保持一致。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vocab.961125.xyz;

    ssl_certificate /etc/ssl/acme/*.961125.xyz.fullchain.crt;
    ssl_certificate_key /etc/ssl/acme/*.961125.xyz.key;

    # 词典导入和 JSON 备份导入可能超过 nginx 默认的 1M 请求体限制
    client_max_body_size 64m;

    location / {
        proxy_pass http://192.168.20.2:8080;

        # 透传真实客户端 IP 和协议
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 应用当前不用 WebSocket，保留升级头以备将来使用
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 首次 TTS/ASR 调用可能要在 AI 容器内下载模型权重，给足超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 音频播放和录音上传不缓冲，避免 PWA 交互卡顿
        proxy_buffering off;
    }
}

# HTTP 跳转 HTTPS（仅本域名，不影响 LuCI）
server {
    listen 80;
    listen [::]:80;
    server_name vocab.961125.xyz;

    return 301 https://$host$request_uri;
}
